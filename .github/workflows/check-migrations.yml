name: Check migrations applied

# Fails when the repo's migrations and production's recorded migrations disagree:
# a migration that was never applied, one applied with no repo file, or one applied
# under a DIFFERENT version than its filename. That last case is the one that
# silently disabled production deploys for two weeks from 2026-07-23, because
# `supabase db push` aborts wholesale on it. Detect-only (never auto-applies).
# Uses the same SUPABASE_ACCESS_TOKEN secret as deploy-functions.yml, no new secret.
on:
  # On a PR this is a blocking gate for DRIFT (`--allow-missing`): a migration the
  # PR adds cannot be in production yet, because the merge is what applies it.
  # No `paths` filter — drift is introduced by applying OUT of band, which by
  # definition leaves no migration file in the diff, so a path filter would skip
  # exactly the case worth catching. The cost is accepted knowingly: every PR and
  # every push to main now spends a runner and one Management API call, including
  # on changes that cannot touch migrations.
  pull_request:
    branches: [main]
  # On main this is the post-merge alarm: the production apply happens after the
  # merge, so nothing at PR time can prove it succeeded.
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege: the job never authenticates to GitHub with GITHUB_TOKEN, only
# to Supabase via the SUPABASE_ACCESS_TOKEN secret, so it needs no repo write access.
permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    # A fork PR cannot see repository secrets, so the job would fail on a missing
    # token rather than on real drift. Skip it there instead of showing a red check
    # that says nothing about the migrations.
    #
    # Dependabot PRs are skipped for the same reason via a different route: GitHub runs
    # them against the *Dependabot* secret store rather than the Actions one, so
    # SUPABASE_ACCESS_TOKEN arrives empty and every Dependabot PR fails on the token
    # instead of on drift. The fork guard above does not catch this, because Dependabot
    # branches live in this repo and so pass the `head.repo.full_name` test. Copying a
    # production Supabase token into that second store would hand it to dependency-update
    # runs to satisfy a check a lockfile bump can never fail — drift comes from applying
    # out of band, which Dependabot does not do. Scoped to `pull_request` so the
    # post-merge alarm on `push` keeps running unconditionally.
    #
    # Known gap: `user.login` is the PR's ORIGINAL author and GitHub never changes it,
    # so hand-pushing a commit onto an open Dependabot PR keeps the branch exempt. That
    # is the deliberate trade for a condition that survives manual re-runs (`github.actor`
    # would flip to whoever clicked re-run and start failing on the empty token again).
    # It only bites if someone adds a migration to a dependency PR — do that in its own
    # PR, where the check runs.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Pre-merge: enforce drift only. Post-merge: enforce everything, but poll for
      # up to 5 minutes first, because the Supabase deploy workflow applies
      # migrations asynchronously and its health step alone waits up to 2 minutes.
      - name: Check repo and production migrations agree on name and version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wmtbjajmnjxefrhkchts
        run: >-
          node scripts/check-migrations.mjs
          ${{ github.event_name == 'pull_request' && '--allow-missing' || '--wait-seconds=300' }}
