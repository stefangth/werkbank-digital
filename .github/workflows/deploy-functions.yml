name: Deploy Edge Functions (production)

# Deploys every Supabase Edge Function in supabase/functions/ to the live project
# whenever function code (or its config) lands on `main`. This is what makes
# "edge functions deploy automatically" actually true: without it, functions merged
# to main stay un-deployed and the frontend 404s when it invokes them (e.g. the GDPR
# functions sat un-deployed after PR #125 until a manual MCP deploy).
#
# `supabase functions deploy` (no function name) deploys ALL functions under
# supabase/functions/, skipping `_`-prefixed dirs (so _shared is left alone) and
# bundling each function's transitive imports (../_shared/*, the react-email template
# tree, etc.) from the checkout. It does NOT delete live functions that are absent
# from the repo, so anything deployed out-of-band (e.g. cron-health-watcher) is left
# untouched. Per-function `verify_jwt` is pinned in supabase/config.toml and applied
# by the CLI on deploy, so public webhooks / cron callers keep working and
# authenticated endpoints stay locked down.
#
# Trigger: gated on a GREEN CI run of the merged `main` commit, plus manual dispatch
# (Actions -> this workflow -> Run workflow) for backfills / re-syncs.
#
# Why `workflow_run` instead of `push: main` (H1): this repo is private/free-plan,
# so branch-protection "required status checks" aren't available. A `push` trigger
# would deploy the moment a commit lands on main — even if a PR was merged before CI
# finished, or someone pushed straight to main — shipping untested edge functions.
# Instead we wait for the "CI" workflow (ci.yml, which now also runs on `push: main`)
# to *complete* on the merged commit, then the job-level `if` below deploys only when
# that CI run passed. The old push-paths filter ("only deploy when functions/config
# changed") is preserved best-effort by the git-diff step in the deploy job — but the
# gate (never deploy a red commit) matters more than that optimization.
#
# The deploy is ALSO gated on the schema having landed (check-migrations.mjs, run
# below), so an unapplied migration cannot ship edge functions against a schema
# that does not exist — what broke multi-date hire orders on 2026-07-24. Drift
# blocks this deploy on purpose, including for changes unrelated to the drifted
# migration.
#
# SCOPE: this covers EDGE FUNCTIONS ONLY. The Vercel frontend builds and promotes
# straight off the merge commit and is not gated by anything here, so the same
# failure can still reach users through the UI. Closing that half needs a separate
# mechanism on the Vercel side.
#
# Required repository secret (already configured; shared with check-migrations):
#   SUPABASE_ACCESS_TOKEN — a Supabase personal access token
#                           (https://supabase.com/dashboard/account/tokens)

on:
  workflow_run:
    # Must match ci.yml's `name:` exactly.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it midway (a half-applied deploy could leave functions inconsistent).
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy functions to live project
    runs-on: ubuntu-latest
    # THE GATE: only run when the triggering CI run passed, or on a manual dispatch
    # (backfills / re-syncs, which have no workflow_run to gate on). A failed or
    # cancelled CI run — i.e. a red commit on main — never reaches this job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Single source of truth for the target project: check-migrations.mjs reads
      # PROJECT_REF when SUPABASE_PROJECT_REF is unset, so there is nothing here
      # that can be repointed to a different project than the deploy targets.
      PROJECT_REF: wmtbjajmnjxefrhkchts
    steps:
      # Check out the exact commit CI tested. For workflow_run this is the CI run's
      # head SHA; for workflow_dispatch that expression is empty so checkout falls
      # back to the branch the workflow was dispatched from. fetch-depth: 2 gives us
      # the parent commit needed by the "did functions change" diff below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      # Best-effort restoration of the old push-paths optimization: skip the deploy
      # when the merged commit changed nothing under supabase/functions/ or config.
      # Only applies to workflow_run; a manual dispatch always deploys. If the diff
      # can't be computed (e.g. shallow history), we err toward deploying.
      - name: Check whether functions or config changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — deploying."
            exit 0
          fi
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          if git rev-parse --verify --quiet "${HEAD_SHA}^" >/dev/null; then
            if git diff --name-only "${HEAD_SHA}^" "${HEAD_SHA}" \
                 | grep -Eq '^supabase/functions/|^supabase/config\.toml$'; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "Function/config changes detected — deploying."
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "No function/config changes — skipping deploy."
            fi
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Parent commit unavailable — deploying to be safe."
          fi

      # Never ship functions against a schema that did not land. This is the same
      # check that runs on PRs and on push:main; running it here too is what makes
      # the code deploy and the schema deploy rise and fall together.
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version: "20"

      # Polls for up to 5 minutes: the Supabase deploy workflow applies migrations
      # asynchronously and may still be mid-apply when CI finishes. Failing here
      # has a side effect — workflow_run will not re-fire, so recovery needs a
      # manual dispatch — which is exactly why it waits rather than reading once.
      - name: Verify the repo's migrations are applied to production
        if: steps.changed.outputs.deploy == 'true'
        run: node scripts/check-migrations.mjs --wait-seconds=300

      - uses: supabase/setup-cli@v3
        if: steps.changed.outputs.deploy == 'true'
        with:
          # Pinned to match the rest of CI (ci.yml).
          version: 2.98.2

      - name: Show Supabase CLI version
        if: steps.changed.outputs.deploy == 'true'
        run: supabase --version

      - name: Deploy all edge functions
        if: steps.changed.outputs.deploy == 'true'
        # No function name → deploys every function under supabase/functions/.
        # verify_jwt comes from supabase/config.toml (every function MUST be listed
        # there; an unlisted function defaults to verify_jwt = true). Idempotent:
        # re-deploying unchanged code just creates a new version.
        run: supabase functions deploy --project-ref "$PROJECT_REF"
