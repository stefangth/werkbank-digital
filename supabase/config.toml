# ─────────────────────────────────────────────────────────────────────────────
# Auth — LOCAL STACK ONLY (config.toml configures the local `supabase start`
# stack and preview branches; production auth is configured in the Supabase
# dashboard and is NOT touched by this file — the deploy only reads the
# [functions.*] blocks below, see deploy-functions.yml).
#
# The local app + Playwright e2e server run on :8080 (vite config;
# e2e/playwright.config.ts baseURL). GoTrue only honours an auth redirect_to
# that matches site_url or an entry in additional_redirect_urls; anything else
# silently falls back to site_url. We declare :8080 explicitly so recovery /
# invite / confirmation links land on the running app — instead of inheriting
# the CLI's built-in default (127.0.0.1:3000), which drifts between CLI versions
# and dead-ended the reset-password e2e on a port with nothing on it.
# ─────────────────────────────────────────────────────────────────────────────
[auth]
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://localhost:8080", "http://127.0.0.1:8080"]

# ─────────────────────────────────────────────────────────────────────────────
# API — schemas exposed through PostgREST on the LOCAL stack. `werkbank` is the
# Werkbank plugin schema (ADR-0013); production needs the same entry under
# "Exposed schemas" in the Supabase dashboard. An existing local volume needs
# `supabase migration up --local` (or `npm run local:reset`) after pulling: PostgREST
# cannot load the werkbank schema before the migration is applied.
# ─────────────────────────────────────────────────────────────────────────────
[api]
schemas = ["public", "graphql_public", "werkbank"]

# ─────────────────────────────────────────────────────────────────────────────
# Edge function JWT verification — pinned per function.
#
# `supabase functions deploy` (.github/workflows/deploy-functions.yml) applies
# these on every deploy. A function NOT listed here defaults to verify_jwt = true,
# which would BREAK the public webhooks and the cron callers — so EVERY function in
# supabase/functions/ must have a block below. These values mirror the live project
# (wmtbjajmnjxefrhkchts); when you add a function, add its block here too.
#
#   verify_jwt = true  → the gateway requires a valid JWT (a user session OR the
#                        service-role key, which is itself a signed JWT). The handler
#                        still runs its own role check (requireRole / requireOrgRole /
#                        requireSuperAdmin / isServiceRole).
#   verify_jwt = false → no JWT required at the gateway. For public webhooks and for
#                        cron callers that authenticate via the X-Cron-Secret header
#                        (requireCronOrRole) instead of a JWT.
# ─────────────────────────────────────────────────────────────────────────────

# ── Authenticated: user session, or service-role key (a JWT) for server-to-server ──
[functions.admin-list-users]
verify_jwt = true

[functions.airtable-schema]
verify_jwt = true

[functions.close-offer-tier]
verify_jwt = true

[functions.create-invitation]
verify_jwt = true

[functions.delete-my-account]
verify_jwt = true

[functions.demo-ops]
verify_jwt = true

[functions.export-org-data]
verify_jwt = true

[functions.fetch-remote-sheet]
verify_jwt = true

[functions.import-sheet-dates]
verify_jwt = true

[functions.open-offer-tier]
verify_jwt = true

[functions.org-purge-removed-user]
verify_jwt = true

[functions.platform-edge-metrics]
verify_jwt = true

[functions.platform-list-users]
verify_jwt = true

[functions.platform-manage-user]
verify_jwt = true

[functions.provision-org]
verify_jwt = true

[functions.resend-invitation]
verify_jwt = true

# Service-role-only: the gateway accepts the service-role JWT; the handler's
# isServiceRole gate then rejects ordinary user JWTs. Digests/invitations call it
# server-to-server with the service role, so they pass.
[functions.send-transactional-email]
verify_jwt = true

# ── Public (no JWT): webhooks + preview ──────────────────────────────────────
[functions.handle-email-suppression]
verify_jwt = false

[functions.handle-email-unsubscribe]
verify_jwt = false

# health-rollup: dispatched by pg_cron with X-Cron-Secret, never with a JWT. It
# self-authorizes via requireCronOrRole(deps, req, []) — the empty role list means
# the requireRole fallback matches nothing, so only the cron secret gets in.
[functions.health-rollup]
verify_jwt = false

# documenso-webhook: Documenso carries no Supabase JWT on its webhook deliveries;
# the handler self-authorizes via a constant-time compare against the
# Vault-backed DOCUMENSO_WEBHOOK_SECRET edge secret (X-Documenso-Secret header).
[functions.documenso-webhook]
verify_jwt = false

[functions.preview-transactional-email]
verify_jwt = false

# ── Cron-invoked: authenticate via the X-Cron-Secret header, not a JWT ───────
# (requireCronOrRole also accepts an admin/producer JWT for manual triggers, which
# the handler validates itself — so verify_jwt stays false for the cron path.)
[functions.airtable-poll]
verify_jwt = false

# generate-hire-orders: the fully-filled trigger + cron callers use X-Cron-Secret,
# and the download-url action authorizes artists (who are neither admin nor producer)
# against the loaded order — so the gateway must not force a JWT; auth is in-function
# (requireCronOrRole for draft/issue/preview, a bespoke check for download-url).
[functions.generate-hire-orders]
verify_jwt = false

[functions.cron-health-watcher]
verify_jwt = false

[functions.email-health-watcher]
verify_jwt = false

[functions.expire-offers]
verify_jwt = false

[functions.send-offer-digest]
verify_jwt = false

[functions.send-confirmation-digest]
verify_jwt = false

[functions.tier-at-risk-watcher]
verify_jwt = false

[functions.notify-cast]
verify_jwt = true

# send-login-link: called from the unauthenticated login screen to request a branded
# magic-link email, so the gateway must not require a JWT. It hides account existence
# (always 200) and self-throttles via the claim_login_link_slot RPC.
[functions.send-login-link]
verify_jwt = false

# Public invitation exchange is authorized by its high-entropy stable token and
# atomically throttled by claim_invitation_auth_exchange before minting a link.
[functions.exchange-invitation]
verify_jwt = false

# sandbox-view: unauthenticated read-only demo snapshot for a leave-behind link
# a prospect opens with no login. Auth is the high-entropy demo_sandbox_links
# token, validated inline (expiry/revocation + org.is_demo re-assertion); the
# response is a curated, display-safe snapshot (see index.ts).
[functions.sandbox-view]
verify_jwt = false

# werkbank-quotes: quote preview, send, resend and download for the Werkbank module, plus
# the public token actions a customer opens with no login. The internal actions authorize
# the caller through requireOrgRole; the public ones by the SHA-256 of the link token.
[functions.werkbank-quotes]
verify_jwt = false

# werkbank-invoices: invoice preview, issue (finalize_invoice through the caller's JWT, then the
# Factur-X file) and download for the Werkbank module. No public actions, so the gateway
# verifies the JWT; the function still checks the org role through requireOrgRole.
[functions.werkbank-invoices]
verify_jwt = true

# werkbank-dunning: dunning notice preview, issue (create_dunning_notice through the caller's JWT,
# then the PDF) and download. No public actions, so the gateway verifies the JWT.
[functions.werkbank-dunning]
verify_jwt = true

# werkbank-reports: the visit report PDF of an order (Teil 6a, R7). Office only (admin, producer),
# stores nothing. No public actions, so the gateway verifies the JWT.
[functions.werkbank-reports]
verify_jwt = true
